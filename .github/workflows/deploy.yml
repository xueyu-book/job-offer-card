name: Deploy to Aliyun OSS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-job-offer-card
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Install ossutil
        run: |
          curl -fsSL -o ossutil.zip "https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip"
          echo "85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  ossutil.zip" | sha256sum -c -
          unzip -q ossutil.zip
          sudo mv ossutil-2.4.0-linux-amd64/ossutil /usr/local/bin/ossutil
          ossutil version

      - name: Upload dist to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_REGION: cn-beijing
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          set -euo pipefail

          ossutil sync dist/assets "oss://${OSS_BUCKET}/assets" \
            --force \
            --update \
            --cache-control "public, max-age=31536000, immutable"

          shopt -s nullglob
          for file in dist/*; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            case "$name" in
              index.html|.DS_Store) continue ;;
            esac
            ossutil cp "$file" "oss://${OSS_BUCKET}/${name}" \
              --force \
              --cache-control "public, max-age=86400"
          done

          ossutil cp dist/index.html "oss://${OSS_BUCKET}/index.html" \
            --force \
            --cache-control "no-cache"

          ossutil sync dist/assets "oss://${OSS_BUCKET}/assets" \
            --force \
            --update \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          mapfile -t keep < <(find dist -maxdepth 1 -type f ! -name '.DS_Store' -printf '%f\n')
          ossutil ls "oss://${OSS_BUCKET}/" -d --short-format > /tmp/oss-root.txt
          while IFS= read -r line || [ -n "$line" ]; do
            key="${line#oss://${OSS_BUCKET}/}"
            case "$key" in
              ""|*[!A-Za-z0-9._-]*|*/*) continue ;;
            esac
            found=0
            for name in "${keep[@]}"; do
              if [ "$name" = "$key" ]; then
                found=1
                break
              fi
            done
            if [ "$found" -eq 0 ]; then
              ossutil rm "oss://${OSS_BUCKET}/${key}" --force
            fi
          done < /tmp/oss-root.txt

      - name: Refresh CDN index.html
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          CDN_REFRESH_URL: ${{ secrets.CDN_REFRESH_URL }}
        run: |
          set -euo pipefail
          curl -fsSL -o aliyun.tgz "https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz"
          tar -xzf aliyun.tgz
          ./aliyun configure set \
            --profile default \
            --mode AK \
            --region cn-beijing \
            --access-key-id "$OSS_ACCESS_KEY_ID" \
            --access-key-secret "$OSS_ACCESS_KEY_SECRET" \
            >/dev/null
          ./aliyun cdn RefreshObjectCaches \
            --ObjectPath "$CDN_REFRESH_URL" \
            --ObjectType File
